<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricelist</title>
<!--
  Pricelist editor — page shell (source). Loads pricelist-page.js as ES
  modules for development; `node build/build.js` inlines everything into
  one self-contained dist/pricelist.html. Same design tokens as index.html.
-->
<style>
  :root{
    --bg:      #ffffff;
    --panel:   #ffffff;
    --field:   #f6f6f5;
    --edge:    #d6d6d3;
    --ink:     #161616;
    --ink-dim: #5c5c59;
    --danger:  #b3261e;
    --control-h: 30px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Cascadia Code",
            "Fira Code", "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  *{ box-sizing:border-box; }
  html{ background:var(--bg); }
  body{ margin:0; padding:32px 20px 80px; background:var(--bg); color:var(--ink);
        font-family:var(--sans); font-size:13.5px; line-height:1.5; }
  .sheet{ max-width:1040px; margin:0 auto; }
  ::selection{ background:var(--ink); color:#fff; }
  input, select{ accent-color:var(--ink); }
  h1{ font-size:18px; margin:0; }
  h2{ font-size:15px; margin:24px 0 8px; }

  input:focus-visible, button:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; }
  .btn{
    font-family:var(--sans); font-size:13px; font-weight:600; background:var(--panel); color:var(--ink);
    border:1px solid var(--edge); padding:0 14px; border-radius:3px; cursor:pointer; height:var(--control-h);
  }
  .btn:hover{ background:var(--field); border-color:var(--ink); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  header.top{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #status, #plantStatus{ font-size:12px; color:var(--ink-dim); }
  #status.err, #plantStatus.err{ color:var(--danger); font-weight:700; }
  body.drag .sheet{ outline:2px dashed var(--ink); outline-offset:8px; }

  /* A sheet, not a form: every value sits in a bordered cell, the input
     has no frame of its own, the selected cell gets the frame. */
  table{ border-collapse:collapse; margin:8px 0 0; }
  th, td{ border:1px solid var(--edge); padding:0; height:24px; }
  th{
    background:var(--field); font-size:12px; font-weight:600; color:var(--ink-dim);
    text-align:left; padding:0 6px; white-space:nowrap;
  }
  td.name{ padding:0 6px; white-space:nowrap; }
  td.name small{ color:var(--ink-dim); margin-left:6px; }
  tr.grp td{ background:var(--field); font-weight:700; font-size:12px; padding:0 6px; }
  td input{
    display:block; width:100%; height:100%; min-height:22px; border:0; border-radius:0; background:transparent;
    font:inherit; font-size:12.5px; color:var(--ink); padding:0 6px; outline:none;
  }
  td input:hover{ background:var(--field); }
  td input:focus{ outline:2px solid var(--ink); outline-offset:-2px; background:var(--bg); }
  td input.bad{ color:var(--danger); outline:2px solid var(--danger); outline-offset:-2px; }
  .num{ font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
  th.qty{ padding:0; }
  th.qty .wrap{ display:flex; align-items:center; }
  th.qty input{
    width:56px; height:24px; border:0; background:transparent; font:inherit; font-weight:600;
    color:var(--ink); padding:0 4px 0 6px; outline:none; text-align:right;
  }
  th.qty input:focus{ outline:2px solid var(--ink); outline-offset:-2px; background:var(--bg); }
  th.qty input.bad{ color:var(--danger); outline:2px solid var(--danger); outline-offset:-2px; }
  th.fixed{ text-align:right; }
  /* Plain text controls inside the sheet, not buttons. */
  .x{
    border:0; background:none; font:inherit; color:var(--ink-dim); cursor:pointer;
    padding:0 6px; height:24px;
  }
  .x:hover{ color:var(--ink); }
  th.qty .x:hover{ color:var(--danger); }
  th.add{ padding:0; text-align:center; }
  th.add .x{ font-weight:700; }
  .meta{ width:auto; }
  input.ro{ color:var(--ink-dim); cursor:default; }
  table.kv th{ width:150px; font-weight:400; }
  table.kv td input{ width:300px; text-align:left; }
  td select{
    display:block; width:300px; height:100%; min-height:22px; border:0; border-radius:0; background:transparent;
    font:inherit; font-size:12.5px; color:var(--ink); padding:0 2px; outline:none;
  }
  td select:hover{ background:var(--field); }
  td select:focus{ outline:2px solid var(--ink); outline-offset:-2px; background:var(--bg); }
  table.sv td input.n{ width:150px; } table.sv td input.u{ width:300px; }
  td.chk{ text-align:center; padding:0 8px; }
  .meta input.valid{ width:100px; } .meta input.cur, .meta input.vat{ width:70px; }
  td.p input{ width:64px; } td.min input{ width:64px; }
  .note{ margin:6px 0 0; font-size:12px; color:var(--ink-dim); }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="sheet">
  <header class="top">
    <h1>Plant config <span id="plantFile" style="font-weight:400;color:var(--ink-dim);font-size:13px;"></span></h1>
    <div class="actions">
      <span id="plantStatus"></span>
      <button class="btn" id="btnOpenPlant">Open</button>
      <button class="btn" id="btnSavePlant">Save</button>
      <input type="file" id="inputPlant" accept=".js,text/javascript" class="hidden">
    </div>
  </header>
  <div id="plant"></div>
  <header class="top" style="margin-top:36px;">
    <h1>Pricelist <span id="file" style="font-weight:400;color:var(--ink-dim);font-size:13px;"></span></h1>
    <div class="actions">
      <span id="status"></span>
      <button class="btn" id="btnOpen">Open</button>
      <button class="btn" id="btnSave">Save</button>
      <input type="file" id="input" accept=".json,application/json" class="hidden">
    </div>
  </header>
  <div id="editor"></div>
</div>
<script type="module" src="pricelist-page.js"></script>
</body>
</html>
