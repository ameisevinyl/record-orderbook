<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orderbook</title>
<link rel="stylesheet" href="/src/plant/structure.css">
<link rel="stylesheet" href="/src/plant/theme.css">
</head>
<body>
<header>
  <h1><a href="#/" id="title">Orderbook</a></h1>
  <div id="bar">
    <details id="menu">
      <summary>File</summary>
      <ul id="menuItems"></ul>
    </details>
    <pre id="status"></pre>
  </div>
  <input type="file" id="zipInput" accept=".zip,application/zip" hidden>
  <input type="file" id="folderInput" webkitdirectory hidden>
  <p id="stats"></p>
  <div id="attention"></div>
  <p id="error"></p>
</header>
<main id="out"></main>
<div id="tip" hidden></div>
<script type="module" src="/src/plant/app.js"></script>
</body>
</html>
