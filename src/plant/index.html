<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant view</title>
<style>
  /* Same type and colours as the customer sheet (src/index.html); no
     decoration beyond group frames. */
  :root{
    --bg:#ffffff; --field:#f6f6f5; --edge:#d6d6d3; --ink:#161616; --ink-dim:#5c5c59; --danger:#b3261e;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Cascadia Code",
            "Fira Code", "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:12px 16px 40px; background:var(--bg); color:var(--ink); font:13.5px/1.45 var(--sans); }
  main{ max-width:1000px; }
  h1{ font-size:18px; margin:0 0 8px; }
  h2{ font-size:14px; margin:0 0 4px; }
  h3{ font-size:13.5px; margin:6px 0 2px; }
  button{ font:inherit; padding:2px 12px; border:1px solid var(--ink); background:var(--bg); color:var(--ink); border-radius:0; cursor:pointer; }
  section{ border:1px solid var(--edge); padding:6px 10px; margin:0 0 6px; }
  dl{ display:grid; grid-template-columns:max-content 1fr; gap:0 16px; margin:0; }
  dt{ color:var(--ink-dim); }
  dd{ margin:0; }
  table{ border-collapse:collapse; margin:4px 0; }
  th{ text-align:left; color:var(--ink-dim); font-weight:600; }
  th, td{ padding:0 12px 0 0; vertical-align:top; }
  pre{ font:inherit; white-space:pre-wrap; margin:0; }
  p{ margin:4px 0; }
  .ident{ font-family:var(--mono); color:var(--ink-dim); }
  .title{ font-weight:700; }
  .missing, #error, .gaps{ color:var(--danger); }
  .gaps{ margin:6px 0; padding-left:18px; }
  .complete{ font-weight:700; }
  #error:empty, #status:empty{ display:none; }
  #status.busy::before{ content:""; display:inline-block; width:9px; height:9px; margin-right:6px;
    border:2px solid var(--edge); border-top-color:var(--ink); border-radius:50%;
    vertical-align:-1px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  /* Prelisten: waveform PNG from the server, played part tinted, markers
     as thin lines — the file's own on top, the form's track starts below. */
  .audio-file{ margin:6px 0 10px; }
  .wave{ position:relative; cursor:pointer; margin:2px 0 14px; }
  .wave img{ display:block; width:100%; height:60px; }
  .played{ position:absolute; inset:0 auto 0 0; width:0; background:rgba(22,22,22,.12); pointer-events:none; }
  .mark{ position:absolute; top:0; bottom:0; border-left:1px solid var(--ink); pointer-events:none; font:normal 10px/1 var(--sans); }
  .mark span{ position:absolute; left:2px; top:0; white-space:nowrap; }
  .mark.form{ border-left:1px dashed var(--danger); }
  .mark.form span{ top:auto; bottom:-12px; color:var(--danger); }
  /* Artwork: preview with the plant's overlay and cut lines on top. */
  .art-file{ margin:6px 0 12px; }
  .art{ position:relative; max-width:420px; }
  .art img{ display:block; width:100%; height:100%; }
  .art img[hidden]{ display:none; }
  .art .overlay, .art svg{ position:absolute; inset:0; width:100%; height:100%; }
  .art .trim, .art .bleed{ fill:none; stroke-width:1; vector-effect:non-scaling-stroke; }
  .art .trim{ stroke:var(--ink); }
  .art .bleed{ stroke:var(--danger); stroke-dasharray:4 3; }
  .verdict.review, tr.warn{ color:#8a5a00; }
  .verdict.customer, tr.error{ color:var(--danger); }
  .verdict.ok{ font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>Plant view</h1>
  <button type="button" id="btnLoad">Load project</button>
  <input type="file" id="zipInput" accept=".zip,application/zip" hidden>
  <p id="status"></p>
  <p id="error"></p>
  <div id="out"></div>
</main>
<script type="module" src="/src/plant/app.js"></script>
</body>
</html>
